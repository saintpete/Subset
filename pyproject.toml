[project]
name = "subset"
version = "0.1.0"
description = "Offset subtitles that don't spoil everything."
readme = "README.md"
license = "MIT"
authors = [{ name = "Chris Bennett" }]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "simpleobsws>=1.4",
    "sounddevice>=0.5",
    "numpy>=2.0",
]

[project.urls]
Repository = "https://github.com/saintpete/Subset"

[project.scripts]
subset = "subset.app:main"

[build-system]
requires = ["uv_build>=0.5,<1"]
build-backend = "uv_build"
